<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python and HTML Interaction with Checkboxes</title>
    <style>
        /* 导航条样式 */
        nav {
            background-color: #333;  /* 背景颜色 */
            padding: 10px;  /* 内间距 */
            text-align: center;  /* 文字居中 */
        }

        /* 链接样式 */
        nav a {
            color: white;  /* 链接文字颜色 */
            text-decoration: none;  /* 移除下划线 */
            padding: 14px 20px;  /* 链接的内间距 */
            font-family: Arial, sans-serif;  /* 字体 */
            font-size: 18px;  /* 字体大小 */
        }

        /* 使“天启纪元的战斗”和复选框在同一行 */
        .inline-section {
            display: flex;  /* 使用flex布局 */
            align-items: center;  /* 垂直居中 */
        }

        .inline-section label, .inline-section input {
            margin-right: 10px;  /* 为复选框和标签之间添加间距 */
        }

    </style>
    <script>

        // 发送复选框的布尔值到Python端
        function sendCheckboxValuesToPython() {
            var checkboxes = document.getElementsByName('number');
            var values = {};

            // 获取单选框的选中状态（有无间距）
            var selectedOption = document.querySelector('input[name="UI"]:checked').value;
            values["UI"] = selectedOption;

            // 获取单选框的选中状态
            var selectedOption2 = document.querySelector('input[name="choice"]:checked').value;
            values["choice"] = selectedOption2;
            
            // 获取每个复选框的选中状态
            for (var i = 0; i < checkboxes.length; i++) {
                values[checkboxes[i].value] = checkboxes[i].checked;  // 键为复选框的值，值为布尔状态
            }

            // 获取 "老虎" 和 "猫" 复选框的选中状态
            var tigerCheckbox = document.getElementById('tiger').checked;
            var catCheckbox = document.getElementById('cat').checked;
            values["tiger"] = tigerCheckbox;
            values["cat"] = catCheckbox;

            // 获取升级次数，如果为空则使用默认值 20
            var upgradeInput = document.getElementById('upgradeCount').value;
            var upgradeCount = upgradeInput ? parseInt(upgradeInput) : 20;  // 如果没有输入则取默认值20
            values["upgradeCount"] = upgradeCount;

            // 将布尔值对象发送到Python端
            window.airscript.call('1', JSON.stringify(values));  // 发送JSON对象字符串
            alert(`Sent to Python: ${JSON.stringify(values)}`);  // 弹出提示框确认发送
        }
    </script>
</head>
<body>
    <!-- 顶部索引 -->
    <nav>
        <a href="a.html">标准页</a> | 
        <a href="page2.html">技能预设</a>
    </nav>

    <h1>请告知您的画面类型</h1>
    <form>
        <input type="radio" id="unpadding" name="UI" value="unpadding" checked>
        <label for="unpadding">默认两侧无间距（前置摄影头隐藏的手机/全部模拟器）</label><br>

        <input type="radio" id="padding" name="UI" value="padding">
        <label for="padding">两侧有间距（前置摄像头不隐藏的机型）</label><br>
    </form>

    <br>

    <!-- <h1>选择星魂/升级/梦境/抓高星</h1> -->

    <!-- 单选框选项：星魂和升级 -->
    <form>
        <input type="radio" id="soul" name="choice" value="soul" checked>
        <label for="soul">星魂</label><br>

        <input type="radio" id="upgrade" name="choice" value="upgrade">
        <label for="upgrade">升级</label><br>

        <!-- <input type="radio" id="yise1" name="choice" value="yise1">
        <label for="yise1">异色不自动捕捉（遇到异色后暂停）</label><br>

        <input type="radio" id="yise2" name="choice" value="yise2">
        <label for="yise2">异色自动捕捉（不保证5回合内捉到）（测试数据不足，目前不建议）</label><br> -->

        <input type="radio" id="dream" name="choice" value="dream">
        <label for="dream">梦境第九层刷（去梦境界面开启）（兼职升级）</label><br>

        <!-- <input type="radio" id="highStar" name="choice" value="highStar">
        <label for="highStar">抓高星（测试数据不足，自动战斗模式很难遇高星）</label><br> -->

        <input type="radio" id="tianqi" name="choice" value="tianqi">
        <label for="tianqi">天启纪元（提前技能预设）（不需要选次数，各两次）</label><br>

        <!-- <input type="radio" id="test" name="choice" value="test">
        <label for="test">test</label><br> -->
    </form>

    <h3>选择天启纪元的战斗</h3>
    <div class="inline-section">
        <label for="tiger">老虎</label>
        <input type="checkbox" id="tiger" name="battle" value="tiger" checked>
        
        <label for="cat">猫</label>
        <input type="checkbox" id="cat" name="battle" value="cat" checked>
    </div>


    <h1>选择要刷的星魂（默认全选）</h1>

    <!-- 创建6个复选框，分别对应1到6 -->
    <form>
        <input type="checkbox" id="one" name="number" value="1" checked>
        <label for="one">回音蟹（物防）</label><br>
        
        <input type="checkbox" id="two" name="number" value="2" checked>
        <label for="two">游戏小熊（魔攻）</label><br>
        
        <input type="checkbox" id="three" name="number" value="3" checked>
        <label for="three">浮水波尼（魔防）</label><br>
        
        <input type="checkbox" id="four" name="number" value="4" checked>
        <label for="four">兔宝（速度）</label><br>
        
        <input type="checkbox" id="five" name="number" value="5" checked>
        <label for="five">圣山之巅（物攻+体力）</label><br>
        
    </form>

    <!-- 升级次数输入框，默认值为20 -->
    <label for="upgradeCount">选择升级/星魂/梦境次数（一天四次满，可累加）（默认20）</label>
    <input type="number" id="upgradeCount" placeholder="20">

    <br><br>


    <!-- 发送按钮 -->
    <button onclick="sendCheckboxValuesToPython()">确认</button>

</body>
</html>
